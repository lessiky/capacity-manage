# GitLab CI: lint -> test -> build -> deploy (dev 自动, sit/uat/prod 手动门禁)
stages:
  - lint
  - test
  - build
  - deploy

variables:
  BACKEND_IMAGE: capacity-manage/backend
  FRONTEND_IMAGE: capacity-manage/frontend
  GOPROXY: https://goproxy.cn,direct

go-lint:
  stage: lint
  image: golang:1.26-alpine
  script:
    - cd backend
    - go vet ./...
    - |
      if [ -n "$(gofmt -l .)" ]; then
        echo "gofmt check failed:"
        gofmt -l .
        exit 1
      fi

go-test:
  stage: test
  image: golang:1.26-alpine
  script:
    - cd backend
    - go test ./... -cover
  artifacts:
    when: always
    paths:
      - backend/coverage.txt
    expire_in: 7 days

build-backend:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_TAG
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY" || true
    - docker build -f backend/Dockerfile -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA $BACKEND_IMAGE:latest
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA || true

deploy-dev:
  stage: deploy
  image: docker:27
  services:
    - docker:27-dind
  environment:
    name: dev
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  script:
    # M0 占位: 部署到 dev 主机 (docker compose 升级镜像 + 重启)
    - echo "deploy dev: $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      ssh ops@dev.capacity.internal "cd /opt/capacity-manage && \
        docker compose -f deploy/docker-compose.yml --env-file deploy/env/dev.env pull && \
        docker compose -f deploy/docker-compose.yml --env-file deploy/env/dev.env up -d" || true

deploy-sit:
  stage: deploy
  image: docker:27
  services:
    - docker:27-dind
  environment:
    name: sit
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual
  script:
    - echo "deploy sit: $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA (manual)"
    - |
      ssh ops@sit.capacity.internal "cd /opt/capacity-manage && \
        docker compose -f deploy/docker-compose.yml --env-file deploy/env/sit.env up -d" || true

deploy-uat:
  stage: deploy
  image: docker:27
  services:
    - docker:27-dind
  environment:
    name: uat
  rules:
    - if: $CI_COMMIT_TAG
  when: manual
  script:
    - echo "deploy uat: $BACKEND_IMAGE:$CI_COMMIT_TAG (manual)"
    - |
      ssh ops@uat.capacity.internal "cd /opt/capacity-manage && \
        docker compose -f deploy/docker-compose.yml --env-file deploy/env/uat.env up -d" || true

deploy-prod:
  stage: deploy
  image: docker:27
  services:
    - docker:27-dind
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TAG
  when: manual
  script:
    - echo "deploy prod: $BACKEND_IMAGE:$CI_COMMIT_TAG (manual, 保留上一版本镜像用于回滚)"
    - |
      ssh ops@prod.capacity.internal "cd /opt/capacity-manage && \
        docker compose -f deploy/docker-compose.yml --env-file deploy/env/prod.env up -d" || true